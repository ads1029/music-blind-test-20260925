<!doctype html><html lang="zh-Hans"><head>
<meta name="deployment" content="github-pages"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三轮盲听 · 段落与变化</title><style>
:root{--ink:#231e19;--paper:#eee8da;--red:#b83d2e;--green:#315b45;--line:#b8ad98;--card:#f8f3e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;background-image:linear-gradient(90deg,rgba(35,30,25,.035) 1px,transparent 1px),linear-gradient(rgba(35,30,25,.025) 1px,transparent 1px);background-size:31px 31px}.wrap{width:min(1120px,92vw);margin:auto;padding:60px 0 90px}header{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:24px;margin-bottom:34px}h1{font-size:clamp(40px,7vw,86px);font-weight:500;line-height:.92;letter-spacing:-.05em;margin:0}.stamp{border:2px solid var(--red);color:var(--red);padding:12px 14px;transform:rotate(4deg);font:700 13px/1.3 ui-monospace,monospace;letter-spacing:.14em}.intro{max-width:760px;font-size:17px;line-height:1.8;margin:0 0 42px}.round{background:var(--card);border:1px solid var(--line);margin:0 0 28px;padding:28px;box-shadow:7px 7px 0 rgba(35,30,25,.08);position:relative}.round::before{content:attr(data-round);position:absolute;right:22px;top:12px;color:rgba(35,30,25,.08);font:700 70px/1 ui-monospace,monospace}h2{font-size:28px;margin:0 0 8px}.meta{font:13px/1.6 ui-monospace,monospace;color:#6a6257}.brief{max-width:880px;line-height:1.65;margin:18px 0 24px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.track{border-top:5px solid var(--ink);background:#fff;padding:18px}.track h3{font:700 32px/1 ui-monospace,monospace;margin:0 0 18px}.track audio{width:100%;accent-color:var(--red)}.pick{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.pick button{border:1px solid var(--ink);background:transparent;padding:11px 14px;font:700 13px ui-monospace,monospace;cursor:pointer}.pick button:hover,.pick button.active{background:var(--ink);color:var(--paper)}textarea{width:100%;min-height:80px;margin-top:16px;border:1px solid var(--line);background:#fbf8f1;padding:12px;font:15px/1.5 inherit}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tags label{border:1px solid var(--line);padding:7px 9px;font:12px ui-monospace,monospace;cursor:pointer}.tags label:has(input:checked){background:var(--green);color:white;border-color:var(--green)}.tags input{display:none}.actions{display:flex;gap:14px;align-items:center;margin-top:36px}.primary{background:var(--red);color:white;border:0;padding:15px 22px;font:700 14px ui-monospace,monospace;cursor:pointer}.secondary{background:transparent;border:1px solid var(--ink);padding:14px 20px;font:700 14px ui-monospace,monospace;cursor:pointer}.status{font:13px ui-monospace,monospace;color:var(--green)}.reveal-box{display:none;margin-top:28px;background:var(--ink);color:var(--paper);padding:26px;border-left:7px solid var(--red);box-shadow:7px 7px 0 rgba(35,30,25,.15)}.reveal-box.show{display:block;animation:reveal-in .35s ease-out}.reveal-box h2{margin:0 0 8px;color:#fff}.reveal-note{margin:0 0 20px;color:#d8cfbe}.answer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer-card{border:1px solid #6f675c;padding:15px;background:#2d2721}.answer-card strong{display:block;color:#fff;font:700 15px/1.5 ui-monospace,monospace}.answer-card span{color:#e7b7ac;font:700 13px/1.5 ui-monospace,monospace}@keyframes reveal-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.method{margin-top:45px;border-top:1px solid var(--line);padding-top:20px;font-size:14px;line-height:1.7;color:#5e564c}@media(max-width:760px){header{grid-template-columns:1fr}.stamp{justify-self:start}.choices,.answer-grid{grid-template-columns:1fr}.wrap{padding-top:34px}.round{padding:20px}}
</style></head><body><main class="wrap"><header><div><div class="meta">LISTENING STUDY / 03 ROUNDS / 06 TRACKS</div><h1>不看型号，<br>只听音乐。</h1></div><div class="stamp">BLIND<br>SESSION</div></header><p class="intro">每轮 A、B 使用完全相同的提示词、seed、时长和推理参数，只有生成模型不同。建议戴耳机，先完整听完两首，再选择你更喜欢的一首。页面不会显示或加载答案键。</p><div id="rounds"></div><div class="actions"><button class="primary" id="export">导出盲听结果 JSON</button><button class="secondary" id="clear">清空本地记录</button><button class="secondary" id="reveal">揭晓答案</button><span class="status" id="status">自动保存在此浏览器</span></div><section class="reveal-box" id="reveal-panel" aria-live="polite"><h2>答案揭晓</h2><p class="reveal-note">以下对应关系仅在你主动点击后显示。建议先完成三轮选择并导出结果。</p><div class="answer-grid" id="answer-grid"></div></section><p class="method">评价时重点听：段落是否真正变化、主题是否能被记住并回归、日式乐器是否自然、结尾是否完整。不要根据音量大小判断；两组文件都采用相同的输出规范。</p></main><script>
const storeKey='ace-blind-20260925-v1';let state=JSON.parse(localStorage.getItem(storeKey)||'{}');
function save(){localStorage.setItem(storeKey,JSON.stringify(state));document.querySelector('#status').textContent='已保存 · '+new Date().toLocaleTimeString()}
fetch('rounds.json').then(r=>r.json()).then(data=>{const root=document.querySelector('#rounds');data.rounds.forEach(r=>{const el=document.createElement('section');el.className='round';el.dataset.round=String(r.round).padStart(2,'0');el.innerHTML=`<h2>${r.title}</h2><div class="meta">${r.bpm} BPM · ${r.key} · 60 SEC · SEED ${r.seed}</div><p class="brief">${r.prompt}</p><div class="choices">${r.options.map(o=>`<article class="track"><h3>${o.label}</h3><audio controls preload="metadata" src="${o.file}"></audio></article>`).join('')}</div><div class="pick"><button data-v="A">A 更好</button><button data-v="B">B 更好</button><button data-v="TIE">难分高下</button><button data-v="NONE">都不满意</button></div><div class="tags">${['段落变化更清楚','主题更好记','日式感更自然','音色更真实','结尾更完整','杂音或伪影更少'].map(t=>`<label><input type="checkbox" value="${t}">${t}</label>`).join('')}</div><textarea placeholder="可选：记录你听到的差异，例如 0:32 开始进入新段落……"></textarea>`;root.appendChild(el);const s=state[r.round]||{};el.querySelectorAll('.pick button').forEach(b=>{if(b.dataset.v===s.choice)b.classList.add('active');b.onclick=()=>{el.querySelectorAll('.pick button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state[r.round]={...(state[r.round]||{}),choice:b.dataset.v};save()}});el.querySelectorAll('.tags input').forEach(c=>{c.checked=(s.tags||[]).includes(c.value);c.onchange=()=>{state[r.round]={...(state[r.round]||{}),tags:[...el.querySelectorAll('.tags input:checked')].map(x=>x.value)};save()}});const ta=el.querySelector('textarea');ta.value=s.note||'';ta.oninput=()=>{state[r.round]={...(state[r.round]||{}),note:ta.value};save()}})});
const answers=[{round:1,label:'A',model:'ACE-Step 1.5 SFT 2B'},{round:1,label:'B',model:'ACE-Step 1.5 XL-SFT 4B'},{round:2,label:'A',model:'ACE-Step 1.5 XL-SFT 4B'},{round:2,label:'B',model:'ACE-Step 1.5 SFT 2B'},{round:3,label:'A',model:'ACE-Step 1.5 XL-SFT 4B'},{round:3,label:'B',model:'ACE-Step 1.5 SFT 2B'}];document.querySelector('#reveal').onclick=()=>{if(!confirm('确定揭晓答案吗？建议先完成三轮选择并导出结果。'))return;const panel=document.querySelector('#reveal-panel');document.querySelector('#answer-grid').innerHTML=answers.map(a=>`<article class="answer-card" data-answer-row><strong>第 ${a.round} 轮 · ${a.label}</strong><span>${a.model}</span></article>`).join('');panel.classList.add('show');document.querySelector('#reveal').disabled=true;document.querySelector('#reveal').textContent='答案已揭晓';panel.scrollIntoView({behavior:'smooth',block:'center'})};document.querySelector('#export').onclick=()=>{const payload={study:'ace-blind-20260925',exportedAt:new Date().toISOString(),ratings:state};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='blind-listening-results.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clear').onclick=()=>{if(confirm('确认清空本地盲听记录？')){localStorage.removeItem(storeKey);location.reload()}};
</script></body></html>
